name: ArchiveLens workspace tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run the renamed Rust workspace
        run: cargo test --locked --workspace --manifest-path workspace/Cargo.toml
