name: ArchiveLens contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JRBusiness/REipa
          ref: a21259b096344b9c69dac508f1fe935c785be9f2
          path: .upstream
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 -m pip install capstone==5.0.7
      - run: python3 verification/lens_upstream_lock.py .upstream
      - run: python3 verification/lens_contract.py --upstream .upstream --output contract.json
      - uses: actions/upload-artifact@v4
        with:
          name: lens-contract-report
          path: contract.json
